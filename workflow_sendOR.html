<!DOCTYPE html>
<html>
<head>
<title>Send Patient to OR</title>
<link rel="stylesheet" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>Send Patient to OR</h1>

<div class="section">
<h2>Preparation</h2>
<ul>
<li>Make patient NPO</li>
<li>Post case via APP or surgical fellow</li>
<li>Call CTOR charge nurse</li>
<li>Notify perfusion if CPB/MCS expected</li>
<li>Notify cardiac anesthesia</li>
</ul>
</div>

<div class="section">
<h2>Before Transport</h2>
<ul>
<li>Prepare blood products</li>
<li>Optimize drips/tubing</li>
<li>Obtain consent</li>
</ul>
</div>

</body>
</html>
