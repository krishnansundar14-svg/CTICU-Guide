<!DOCTYPE html>
<html>
<head>
<title>ICU Bedflow</title>
<link rel="stylesheet" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>ICU Bedflow</h1>

<div class="section">
<h2>Floor Transfer Criteria</h2>
<ul>
<li>Stable hemodynamics</li>
<li>No orthostasis</li>
<li>O2 requirement <6 L</li>
<li>Completed TCT >48 hrs</li>
</ul>
</div>

<div class="section">
<h2>Other ICU Transfers</h2>
<ul>
<li>CICU: Impella or CHB awaiting PPM</li>
<li>MICU: VV ECMO</li>
</ul>
</div>

</body>
</html>
